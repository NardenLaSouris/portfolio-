<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<meta name="robots" content="noindex">
<title>ORION</title>
<!-- Copie de la page du visage d'ORION (orion/face/static), affichée dans l'étude de cas du portfolio.
     Seul ajout : pas de flux d'événements (il n'y a pas de Core ici) ; l'état est donné par la page parente,
     avec l'API du visage : OrionFace.setVisualState("standby" | "listening" | "thinking" | "speaking"). -->
<link rel="stylesheet" href="face.css">
<script>try { delete window.EventSource; } catch (e) {}</script>
</head>
<body>
<canvas id="face" aria-label="Visage d'ORION" role="img"></canvas>
<canvas id="effects" aria-hidden="true"></canvas>
<div id="greeting" role="status" aria-live="polite" hidden></div>
<svg id="upcoming" viewBox="0 0 100 100" aria-hidden="true" hidden>
  <circle class="track" cx="50" cy="50" r="48"></circle>
  <circle class="fill" cx="50" cy="50" r="48" pathLength="100"></circle>
</svg>
<div id="upcoming-label" role="status" aria-live="polite" hidden></div>
<div id="error" role="status" aria-live="polite" hidden></div>
<div id="debug" hidden></div>
<script src="face.js"></script>
</body>
</html>
